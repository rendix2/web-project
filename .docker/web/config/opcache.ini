; OPcache - the SAME file in alfred, web-project and family-tree, in the dev and in the production image (keep them identical,
; tests/Unit/OpcacheSettingsCest checks that the running PHP uses it).
opcache.enable=1
opcache.enable_cli=1

; function JIT (1205), not tracing: the tracing JIT broke the Doctrine migrations at random on PHP 8.4.27 ("There is no table with
; name ... in the schema", a different migration on every run; alfred 2026-11-12, family-tree 2026-11-18)
opcache.jit=1205
opcache.jit_buffer_size=256M

opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=100000

; the timestamps are checked on every request, in production too: the generated PHP files (DI container, Latte, RobotLoader cache)
; are rewritten under the same name and must not be served stale
opcache.validate_timestamps=1
opcache.revalidate_freq=0
