services:
  web-project-web:
    build:
      context: ./
      dockerfile: ./.docker/web/Dockerfile
    ports:
      - "9180:80"
    environment:
      - SERVERNAME=web-project
      - SERVERALIAS=example2.local *.example2.local
      - DOCUMENTROOT=www
      - NETTE_DEBUG_SECRET=SC9NJHrQOrcys2sdaySIZvxQKKQp5Dx0HT0SMD9fsqkMEwPV93nGUzSW5ryXZ1sS
    volumes:
      - ./:/var/www/html/
    depends_on:
      - web-project-postgres
      - web-project-redis
    tty: true

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    volumes:
      - /dev/shm:/dev/shm
    ports:
      - "4544:4444"
      - "5901:5900"
      - "7901:7900"
    depends_on:
      - web-project-postgres
      - web-project-web

  web-project-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: web-project
      POSTGRES_USER: web-project
      POSTGRES_PASSWORD: password
    ports:
      - "5532:5432"
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data

  web-project-adminer:
    image: adminer
    restart: always
    ports:
      - "9182:8080"
    environment:
      ADMINER_DEFAULT_SERVER: web-project-postgres
    depends_on:
      - web-project-postgres

  web-project-redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis/data:/data