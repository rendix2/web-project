# Suite for acceptance tests: a real browser (Selenium / Chrome) against the running web container.

actor: AcceptanceTester
suite_namespace: Tests\Acceptance
modules:
    enabled:
        - Asserts
        - WebDriver:
              url: http://web-project-web
              host: selenium-chrome
              browser: chrome
        - Contributte\Codeception\Module\NetteDIModule:
              tempDir: ../../temp/codeception
              logDir: ../../log/codeception
              appDir: ../../app
              wwwDir: ../../www
              configFiles:
                  - ../../config/codeception/common.neon
                  - ../../config/codeception/local.neon
              newContainerForEachTest: true
              removeDefaultExtensions: false
              debugMode: true
        - Tests\Support\Helper\CleanupTestData

step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry
